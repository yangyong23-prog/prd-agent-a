# =========================================================================
# 【prod 环境差异配置】k8s/env/prod.yml
# prod 使用 k8s_env_config.yml + 模板的默认值，此处只覆盖生产专属配置
# 加载顺序：k8s_env_config.yml → 本文件 → k8s_env_config_template.yml
# 触发分支：main
# =========================================================================

# ─────────────────────────────────────────────────────────────────────────
# 命名空间配置
# ─────────────────────────────────────────────────────────────────────────

# K8s 命名空间：Deployment、Service、Secret、ConfigMap、PVC 等资源所在的命名空间
# prod 环境使用独立命名空间，与 dev/qa 隔离
K8S_NAMESPACE=persagy-ai-prod

# Ingress 命名空间：Ingress 控制器所在的命名空间，通常与 K8S_NAMESPACE 一致
INGRESS_NAMESPACE=persagy-ai-prod


# ─────────────────────────────────────────────────────────────────────────
# 副本数与资源配置
# ─────────────────────────────────────────────────────────────────────────

# Deployment 副本数：生产环境单副本（可根据需要调整为多副本）
REPLICAS=1

# 内存限制：Pod 最大可用内存，超出会被 OOM Kill
# 注意：prod 环境如需更大内存，可取消以下注释并修改
# MEMORY_LIMIT=1Gi

# 内存请求：K8s 调度时保证分配的最小内存
# MEMORY_REQUEST=512Mi

# CPU 限制：Pod 最大可用 CPU 核数
# CPU_LIMIT=1000m

# CPU 请求：K8s 调度时保证分配的最小 CPU
# CPU_REQUEST=250m
