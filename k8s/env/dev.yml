# =========================================================================
# 【dev 环境差异配置】k8s/env/dev.yml
# 只填写与公共配置（k8s_env_config.yml）不同的值
# 加载顺序：k8s_env_config.yml → 本文件 → k8s_env_config_template.yml
# 触发分支：develop
# =========================================================================

# ─────────────────────────────────────────────────────────────────────────
# 命名空间配置
# ─────────────────────────────────────────────────────────────────────────

# K8s 命名空间：Deployment、Service、Secret、ConfigMap、PVC 等资源所在的命名空间
# dev 环境使用独立命名空间，避免污染 qa/prod 环境
K8S_NAMESPACE=persagy-ai-dev

# Ingress 命名空间：Ingress 控制器所在的命名空间，通常与 K8S_NAMESPACE 一致
INGRESS_NAMESPACE=persagy-ai-dev


# ─────────────────────────────────────────────────────────────────────────
# 副本数与资源配置
# ─────────────────────────────────────────────────────────────────────────

# Deployment 副本数：dev 环境单副本，节省开发资源
REPLICAS=1

# 内存限制：Pod 最大可用内存，超出会被 OOM Kill
MEMORY_LIMIT=128Mi

# 内存请求：K8s 调度时保证分配的最小内存
MEMORY_REQUEST=32Mi

# CPU 限制：Pod 最大可用 CPU 核数
CPU_LIMIT=200m

# CPU 请求：K8s 调度时保证分配的最小 CPU
CPU_REQUEST=50m
